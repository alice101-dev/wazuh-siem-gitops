apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-slack-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: wazuh-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: staging-siem-slack-webhook
