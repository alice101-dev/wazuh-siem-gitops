apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: wazuh-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-root-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  isCA: true
  commonName: Wazuh Root CA
  subject:
    organizations: [Wazuh]
    organizationalUnits: [Wazuh]
  secretName: wazuh-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
    encoding: PKCS8
    rotationPolicy: Never
  issuerRef:
    name: wazuh-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: wazuh-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ca:
    secretName: wazuh-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-indexer-node
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  commonName: indexer
  subject:
    organizations: [Wazuh]
    organizationalUnits: [Wazuh]
  secretName: wazuh-indexer-node-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    rotationPolicy: Always
  usages: [server auth, client auth, digital signature, key encipherment]
  dnsNames:
    - wazuh-indexer
    - wazuh-indexer.wazuh.svc
    - wazuh-indexer.wazuh.svc.cluster.local
    - "*.wazuh-indexer-nodes"
    - "*.wazuh-indexer-nodes.wazuh.svc"
    - "*.wazuh-indexer-nodes.wazuh.svc.cluster.local"
    - localhost
  issuerRef:
    name: wazuh-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-indexer-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
