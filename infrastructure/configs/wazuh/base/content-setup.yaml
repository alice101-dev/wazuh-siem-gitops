apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-content-setup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: wazuh-content-setup
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: credentials
          secret:
            secretName: wazuh-credentials
            items:
              - key: indexer.env
                path: indexer.env
        - name: ca
          secret:
            secretName: wazuh-indexer-node-tls
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: enable-integrations
          image: curlimages/curl:8.23.0
          env:
            - name: INTEGRATIONS
              value: gcp
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              indexer=https://wazuh-indexer.wazuh.svc.cluster.local:9200
              password=$(sed -n 's/^WAZUH_INDEXER_ADMIN_PASSWORD=//p' /credentials/indexer.env)
              auth() { printf 'user = "admin:%s"\n' "$password"; }
              for title in $INTEGRATIONS; do
                query=$(printf '{"query":{"bool":{"filter":[{"term":{"space.name":"standard"}},{"term":{"document.metadata.title":"%s"}}]}}}' "$title")
                while :; do
                  found=$(auth | curl -sS --cacert /ca/ca.crt -K - -H "Content-Type: application/json" -d "$query" \
                    "$indexer/wazuh-threatintel-integrations/_search?filter_path=hits.hits._id,hits.hits._source.document.enabled" || true)
                  [ "$(printf '%s' "$found" | grep -o '"_id"' | wc -l)" -eq 1 ] && break
                  echo "Integration $title is not in the standard space yet, retrying in 30s"
                  sleep 30
                done
                id=$(printf '%s' "$found" | sed -nE 's/.*"_id":"([^"]+)".*/\1/p')
                if printf '%s' "$found" | grep -q '"enabled":true'; then
                  echo "Integration $title ($id) is already enabled"
                  continue
                fi
                auth | curl -sSf -o /dev/null --cacert /ca/ca.crt -K - -X PUT -H "Content-Type: application/json" \
                  -d '{"resource":{"enabled":true}}' "$indexer/_plugins/_content_manager/integrations/$id"
                echo "Integration $title ($id) enabled"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: credentials, mountPath: /credentials, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
