apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-gcp-collector-settings
data:
  project_id: PROJECT_ID
  subscription: SUBSCRIPTION
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-gcp-collector
  labels:
    app: wazuh-gcp-collector
spec:
  clusterIP: None
  selector:
    app: wazuh-gcp-collector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-gcp-collector
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-enrollment
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wazuh-enrollment
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [wazuh-gcp-collector-enrollment]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wazuh-enrollment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wazuh-enrollment
subjects:
  - kind: ServiceAccount
    name: wazuh-enrollment
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-enrollment
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/component: wazuh-enrollment
    spec:
      serviceAccountName: wazuh-enrollment
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: credentials
          secret:
            secretName: wazuh-credentials
            items:
              - key: manager.env
                path: manager.env
        - name: ca
          secret:
            secretName: wazuh-manager-apid-tls
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: enroll
          image: curlimages/curl:8.23.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              api=https://wazuh-api.wazuh.svc.cluster.local:55000
              kube=https://kubernetes.default.svc
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              password=$(sed -n 's/^WAZUH_MANAGER_API_PASSWORD=//p' /credentials/manager.env)
              until jwt=$(printf 'user = "wazuh:%s"\n' "$password" | curl -sSf --cacert /ca/ca.crt -K - -X POST "$api/security/user/authenticate?raw=true"); do
                echo "Wazuh API not ready yet, retrying in 15s"
                sleep 15
              done
              response=$(curl -sSf --cacert /ca/ca.crt -X POST "$api/agents/enrollment-tokens" \
                -H "Authorization: Bearer $jwt" -H "Content-Type: application/json" \
                -d '{"address": "wazuh-agents.wazuh.svc.cluster.local", "embed_ca": true, "ttl": "24h", "max_uses": 5, "description": "GCP collector"}')
              token=$(printf '%s' "$response" | sed -n 's/.*"token": *"\([^"]*\)".*/\1/p')
              [ -n "$token" ] || { echo "No token in the API response"; exit 1; }
              printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: wazuh-gcp-collector-enrollment\ndata:\n  token: %s\n' "$(printf '%s' "$token" | base64 | tr -d '\n')" |
                curl -sSf -o /dev/null --cacert "$sa/ca.crt" -H "Authorization: Bearer $(cat "$sa/token")" \
                  -H "Content-Type: application/apply-patch+yaml" -X PATCH --data-binary @- \
                  "$kube/api/v1/namespaces/$(cat "$sa/namespace")/secrets/wazuh-gcp-collector-enrollment?fieldManager=wazuh-enrollment&force=true"
              echo "Enrollment token stored in Secret wazuh-gcp-collector-enrollment"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: credentials, mountPath: /credentials, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-gcp-collector
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  serviceName: wazuh-gcp-collector
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: wazuh-gcp-collector
  template:
    metadata:
      labels:
        app: wazuh-gcp-collector
        app.kubernetes.io/component: wazuh-agent
    spec:
      serviceAccountName: wazuh-gcp-collector
      automountServiceAccountToken: false
      nodeSelector:
        workload: general
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: workload-identity
          configMap:
            name: wazuh-gcp-collector-workload-identity
        - name: config-template
          configMap:
            name: wazuh-gcp-collector-config
        - name: config
          emptyDir: {}
        - name: enrollment
          secret:
            secretName: wazuh-gcp-collector-enrollment
            optional: true
            defaultMode: 0400
        - name: manager-ca
          secret:
            secretName: wazuh-manager-remoted-tls
            items:
              - key: ca.crt
                path: ca.crt
      initContainers:
        - name: prepare-agent
          image: wazuh-gcp-collector
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: wazuh-gcp-collector-settings
                  key: project_id
            - name: GCP_SUBSCRIPTION
              valueFrom:
                configMapKeyRef:
                  name: wazuh-gcp-collector-settings
                  key: subscription
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -z "$(ls -A /pvc-etc)" ]; then
                cp -a /var/ossec/data_tmp/permanent/var/ossec/etc/. /pvc-etc/
              fi
              install -d -o 0 -g 0 -m 0750 /pvc-etc/certs
              install -o 0 -g 0 -m 0644 /manager-ca/ca.crt /pvc-etc/certs/manager-ca.pem
              if [ ! -s /pvc-etc/client.keys ]; then
                [ -s /enrollment/token ] || { echo "Not enrolled yet and no enrollment token: waiting for the wazuh-enrollment Job"; exit 1; }
                install -o 0 -g 0 -m 0600 /enrollment/token /pvc-etc/enrollment_token
              fi
              mkdir -p /config/etc
              sed -e "s|__AGENT_NAME__|gcp-${POD_NAME}|" \
                  -e "s|__GCP_PROJECT_ID__|${GCP_PROJECT_ID}|" \
                  -e "s|__GCP_SUBSCRIPTION__|${GCP_SUBSCRIPTION}|" \
                  /config-template/ossec.conf > /config/etc/ossec.conf
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /pvc-etc, subPath: etc }
            - { name: config-template, mountPath: /config-template, readOnly: true }
            - { name: config, mountPath: /config }
            - { name: enrollment, mountPath: /enrollment, readOnly: true }
            - { name: manager-ca, mountPath: /manager-ca, readOnly: true }
      containers:
        - name: wazuh-agent
          image: wazuh-gcp-collector
          env:
            - name: WAZUH_AGENT_SSL_VERIFICATION
              value: full
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/ossec/etc, subPath: etc }
            - { name: config, mountPath: /wazuh-config-mount, readOnly: true }
            - { name: workload-identity, mountPath: /etc/wazuh-gcp-workload-identity, readOnly: true }
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: pd-ssd-cmek
        resources:
          requests:
            storage: 1Gi
