type: monitor
monitor_type: query_level_monitor
name: Wazuh GCP log pipeline stalled
enabled: true
schedule:
  period:
    interval: 5
    unit: MINUTES
inputs:
  - search:
      indices:
        - wazuh-events-v5-cloud-services
      query:
        size: 0
        track_total_hits: true
        query:
          bool:
            filter:
              - range:
                  '@timestamp':
                    gte: '{{period_end}}||-15m'
                    lte: '{{period_end}}'
                    format: epoch_millis
triggers:
  - query_level_trigger:
      name: No GCP events indexed in 15 minutes
      severity: "1"
      condition:
        script:
          source: ctx.results[0].hits.total.value == 0
          lang: painless
      actions:
        - name: Slack
          destination_id: wazuh-slack
          subject_template:
            source: Wazuh GCP log pipeline stalled
            lang: mustache
          message_template:
            source: '{"attachments": [{"color": "#FF1744", "mrkdwn_in": ["text"], "text": ":rotating_light: *No GCP audit events reached Wazuh in the last 15 minutes*\nCheck the wazuh-gcp-collector pod, the Pub/Sub subscription backlog and the manager.\nChecked: {{ctx.periodEnd}}"}]}'
            lang: mustache
          throttle_enabled: true
          throttle:
            value: 60
            unit: MINUTES
