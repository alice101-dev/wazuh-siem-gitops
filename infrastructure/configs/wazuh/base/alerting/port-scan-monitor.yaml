type: monitor
monitor_type: bucket_level_monitor
name: Kubernetes port scan
enabled: true
schedule:
  period:
    interval: 5
    unit: MINUTES
inputs:
  - search:
      indices:
        - wazuh-events-v5-network-activity
      query:
        size: 0
        query:
          bool:
            filter:
              - range:
                  '@timestamp':
                    gte: '{{period_end}}||-5m'
                    lte: '{{period_end}}'
                    format: epoch_millis
              - term:
                  event.action: deny
        aggregations:
          composite_agg:
            composite:
              size: 100
              sources:
                - pod:
                    terms:
                      script:
                        lang: painless
                        source: 'doc[''orchestrator.namespace''].size()==0 ? ''unknown'' : doc[''orchestrator.namespace''].value + ''/'' + (doc[''orchestrator.resource.name''].size()==0 ? ''?'' : doc[''orchestrator.resource.name''].value)'
            aggs:
              ports:
                cardinality:
                  field: destination.port
              hosts:
                cardinality:
                  field: destination.ip
triggers:
  - bucket_level_trigger:
      name: A pod probed 10 or more ports or hosts in 5 minutes
      severity: "1"
      condition:
        buckets_path:
          ports: ports
          hosts: hosts
        parent_bucket_path: composite_agg
        script:
          source: params.ports >= 10 || params.hosts >= 10
          lang: painless
      actions:
        - name: Slack
          destination_id: wazuh-slack
          subject_template:
            source: Kubernetes port scan
            lang: mustache
          message_template:
            source: '{"attachments": [{"color": "#FF1744", "mrkdwn_in": ["text"], "text": ":rotating_light: *Kubernetes port scan*\nPod: {{#ctx.newAlerts}}`{{bucket_keys}}`{{/ctx.newAlerts}}\nNetworkPolicies denied its connections to 10 or more ports or hosts between {{ctx.periodStart}} and {{ctx.periodEnd}}.\nIts denied connections: `event.action:deny` in wazuh-events-v5-network-activity."}]}'
            lang: mustache
          throttle_enabled: false
          action_execution_policy:
            action_execution_scope:
              per_alert:
                actionable_alerts:
                  - NEW
