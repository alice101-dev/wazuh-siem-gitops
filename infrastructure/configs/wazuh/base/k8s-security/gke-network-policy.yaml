integration:
  title: gke-network-policy
  category: network-activity
  description: GKE Dataplane V2 logs of connections denied by NetworkPolicies.
detector:
  name: gke-network-policy
  indices:
    - wazuh-events-v5-network-activity
  interval_minutes: 1
decoders:
  - name: decoder/gke-network-policy/0
    title: GKE network policy action
    parents:
      - decoder/custom-wazuh-message/0
    description: A connection a NetworkPolicy denied, from the policy-action log of GKE Dataplane V2.
    check: $_tmp_json.integration == 'gcp' AND exists($_tmp_json.gcp.jsonPayload.disposition) AND exists($_tmp_json.gcp.jsonPayload.connection)
    normalize:
      - map:
          - _np: rename($_tmp_json.gcp)
          - _tmp: delete()
          - event.kind: event
          - event.module: gke
          - event.category: array_append(network)
          - event.action: $_np.jsonPayload.disposition
          - event.code: policy-action
          - source.ip: $_np.jsonPayload.connection.src_ip
          - source.port: $_np.jsonPayload.connection.src_port
          - destination.ip: $_np.jsonPayload.connection.dest_ip
          - destination.port: $_np.jsonPayload.connection.dest_port
          - network.transport: $_np.jsonPayload.connection.protocol
          - network.direction: $_np.jsonPayload.connection.direction
          - host.hostname: $_np.jsonPayload.node_name
          - orchestrator.type: kubernetes
          - orchestrator.cluster.name: $_np.resource.labels.cluster_name
          - orchestrator.namespace: $_np.jsonPayload.src.namespace
          - orchestrator.resource.type: pod
          - orchestrator.resource.name: $_np.jsonPayload.src.pod_name
          - destination.domain: $_np.jsonPayload.dest.pod_name
          - cloud.project.id: $_np.resource.labels.project_id
      - check: $_np.jsonPayload.disposition == 'deny'
        map:
          - event.outcome: failure
      - check: exists($_np.jsonPayload.dest.namespace)
        map:
          - tags: array_append($_np.jsonPayload.dest.namespace)
rules:
  - title: GKE connection denied into a security namespace
    level: medium
    description: A NetworkPolicy denied a connection from another namespace into kube-system or a namespace of the SIEM, GitOps, secret or runtime tooling. One alone can be a misconfiguration; many from one pod are a scan (see the port scan monitor).
    selection:
      event.code: policy-action
      event.action: deny
      tags:
        - kube-system
        - wazuh
        - argocd
        - cert-manager
        - external-secrets
        - falco
    exclude:
      same_namespace:
        orchestrator.namespace:
          - kube-system
          - wazuh
          - argocd
          - cert-manager
          - external-secrets
          - falco
    mitre:
      tactic:
        - TA0007
        - Discovery
      technique:
        - T1046
        - Network Service Discovery
