apiVersion: v1
kind: Service
metadata:
  name: wazuh-cluster
  labels:
    app: wazuh-manager
spec:
  clusterIP: None
  selector:
    app: wazuh-manager
  ports:
    - name: cluster
      port: 1516
      targetPort: 1516
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-agents
  labels:
    app: wazuh-manager
spec:
  selector:
    app: wazuh-manager
  ports:
    - name: agents-https
      port: 1517
      targetPort: 1517
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-api
  labels:
    app: wazuh-manager
spec:
  selector:
    app: wazuh-manager
    node-type: master
  ports:
    - name: api
      port: 55000
      targetPort: 55000
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-events
  labels:
    app: wazuh-manager
spec:
  selector:
    app: wazuh-manager
    node-type: worker
  ports:
    - name: agents-events
      port: 1514
      targetPort: 1514
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-registration
  labels:
    app: wazuh-manager
spec:
  selector:
    app: wazuh-manager
    node-type: master
  ports:
    - name: registration
      port: 1515
      targetPort: 1515
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wazuh-manager-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-master
spec:
  replicas: 1
  serviceName: wazuh-cluster
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: master
  template:
    metadata:
      labels:
        app: wazuh-manager
        node-type: master
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: siem
      tolerations:
        - key: workload
          operator: Equal
          value: siem
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: wazuh-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: wazuh-credentials-secret
          secret:
            secretName: wazuh-credentials
            defaultMode: 0400
            items:
              - key: manager.env
                path: wazuh-credentials
        - name: wazuh-manager-certs-raw
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: wazuh-manager-tls
                  items:
                    - { key: tls.crt, path: manager.pem }
                    - { key: tls.key, path: manager-key.pem }
                    - { key: ca.crt, path: root-ca.pem }
              - secret:
                  name: wazuh-manager-remoted-tls
                  items:
                    - { key: tls.crt, path: manager-remoted.pem }
                    - { key: tls.key, path: manager-remoted-key.pem }
              - secret:
                  name: wazuh-manager-apid-tls
                  items:
                    - { key: tls.crt, path: manager-apid.pem }
                    - { key: tls.key, path: manager-apid-key.pem }
        - name: wazuh-manager-certs
          emptyDir: {}
        - name: wazuh-manager-config
          configMap:
            name: wazuh-manager-config
      initContainers:
        - name: install-credentials
          image: wazuh/wazuh-manager
          command:
            - /bin/sh
            - -c
            - umask 077 && cp /credentials-secret/wazuh-credentials /run/secrets/wazuh-credentials && chmod 0400 /run/secrets/wazuh-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: wazuh-credentials-secret
              mountPath: /credentials-secret
              readOnly: true
            - name: wazuh-credentials
              mountPath: /run/secrets
        - name: init-wazuh-etc
          image: wazuh/wazuh-manager
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -z "$(ls -A /pvc-etc)" ]; then
                cp -a /etc/wazuh-manager/. /pvc-etc/
              fi
              if [ -z "$(ls -A /pvc-data)" ]; then
                cp -a /var/wazuh-manager/data/. /pvc-data/
              fi
              certs=/etc/wazuh-certs-final
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/ca-root-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/root-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/indexer-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager.pem "${certs}/indexer-connector.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-key.pem "${certs}/indexer-connector-key.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-remoted.pem "${certs}/remoted.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-remoted-key.pem "${certs}/remoted-key.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-apid.pem "${certs}/apid.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-apid-key.pem "${certs}/apid-key.pem"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /pvc-etc, subPath: wazuh/etc/wazuh-manager }
            - { name: data, mountPath: /pvc-data, subPath: wazuh/var/wazuh-manager/data }
            - { name: wazuh-manager-certs-raw, mountPath: /tmp/certs-raw, readOnly: true }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-certs-final }
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
          env:
            - name: WAZUH_INDEXER_HOSTS
              value: wazuh-indexer:9200
            - name: WAZUH_NODE_NAME
              value: master
            - name: WAZUH_NODE_TYPE
              value: master
            - name: WAZUH_REMOTE_BIND_ADDR
              value: 0.0.0.0
            - name: WAZUH_CLUSTER_BIND_ADDR
              value: 0.0.0.0
            - name: WAZUH_CLUSTER_NODES
              value: wazuh-manager-master-0.wazuh-cluster
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-credentials
                  key: cluster.key
          volumeMounts:
            - { name: wazuh-credentials, mountPath: /run/secrets, readOnly: true }
            - { name: wazuh-manager-config, mountPath: /wazuh-config-mount/etc/wazuh-manager.conf, subPath: wazuh-manager.conf, readOnly: true }
            - { name: data, mountPath: /var/wazuh-manager/api/configuration, subPath: wazuh/var/wazuh-manager/api/configuration }
            - { name: data, mountPath: /etc/wazuh-manager, subPath: wazuh/etc/wazuh-manager }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/ca/root-ca.pem, subPath: ca-root-ca.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/root-ca.pem, subPath: root-ca.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/indexer-ca.pem, subPath: indexer-ca.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/indexer-connector.pem, subPath: indexer-connector.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/indexer-connector-key.pem, subPath: indexer-connector-key.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/remoted.pem, subPath: remoted.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/remoted-key.pem, subPath: remoted-key.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/apid.pem, subPath: apid.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/apid-key.pem, subPath: apid-key.pem }
            - { name: data, mountPath: /var/wazuh-manager/logs, subPath: wazuh/var/wazuh-manager/logs }
            - { name: data, mountPath: /var/wazuh-manager/queue, subPath: wazuh/var/wazuh-manager/queue }
            - { name: data, mountPath: /var/wazuh-manager/var/multigroups, subPath: wazuh/var/wazuh-manager/var/multigroups }
            - { name: data, mountPath: /var/wazuh-manager/data, subPath: wazuh/var/wazuh-manager/data }
          ports:
            - { containerPort: 1517, name: agents-https }
            - { containerPort: 1515, name: registration }
            - { containerPort: 1516, name: cluster }
            - { containerPort: 55000, name: api }
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "/var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "/var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "/var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: pd-balanced-cmek
        resources:
          requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-worker
spec:
  replicas: 1
  serviceName: wazuh-cluster
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: worker
  template:
    metadata:
      labels:
        app: wazuh-manager
        node-type: worker
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: siem
      tolerations:
        - key: workload
          operator: Equal
          value: siem
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: wazuh-manager
                    node-type: worker
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: wazuh-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: wazuh-credentials-secret
          secret:
            secretName: wazuh-credentials
            defaultMode: 0400
            items:
              - key: manager.env
                path: wazuh-credentials
        - name: wazuh-manager-certs-raw
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: wazuh-manager-tls
                  items:
                    - { key: tls.crt, path: manager.pem }
                    - { key: tls.key, path: manager-key.pem }
                    - { key: ca.crt, path: root-ca.pem }
              - secret:
                  name: wazuh-manager-remoted-tls
                  items:
                    - { key: tls.crt, path: manager-remoted.pem }
                    - { key: tls.key, path: manager-remoted-key.pem }
              - secret:
                  name: wazuh-manager-apid-tls
                  items:
                    - { key: tls.crt, path: manager-apid.pem }
                    - { key: tls.key, path: manager-apid-key.pem }
        - name: wazuh-manager-certs
          emptyDir: {}
        - name: wazuh-manager-config
          configMap:
            name: wazuh-manager-config
      initContainers:
        - name: install-credentials
          image: wazuh/wazuh-manager
          command:
            - /bin/sh
            - -c
            - umask 077 && cp /credentials-secret/wazuh-credentials /run/secrets/wazuh-credentials && chmod 0400 /run/secrets/wazuh-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: wazuh-credentials-secret
              mountPath: /credentials-secret
              readOnly: true
            - name: wazuh-credentials
              mountPath: /run/secrets
        - name: init-wazuh-etc
          image: wazuh/wazuh-manager
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -z "$(ls -A /pvc-etc)" ]; then
                cp -a /etc/wazuh-manager/. /pvc-etc/
              fi
              if [ -z "$(ls -A /pvc-data)" ]; then
                cp -a /var/wazuh-manager/data/. /pvc-data/
              fi
              certs=/etc/wazuh-certs-final
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/ca-root-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/root-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/indexer-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager.pem "${certs}/indexer-connector.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-key.pem "${certs}/indexer-connector-key.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-remoted.pem "${certs}/remoted.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-remoted-key.pem "${certs}/remoted-key.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-apid.pem "${certs}/apid.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-apid-key.pem "${certs}/apid-key.pem"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /pvc-etc, subPath: wazuh/etc/wazuh-manager }
            - { name: data, mountPath: /pvc-data, subPath: wazuh/var/wazuh-manager/data }
            - { name: wazuh-manager-certs-raw, mountPath: /tmp/certs-raw, readOnly: true }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-certs-final }
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
          env:
            - name: WAZUH_INDEXER_HOSTS
              value: wazuh-indexer:9200
            - name: WAZUH_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WAZUH_NODE_TYPE
              value: worker
            - name: WAZUH_REMOTE_BIND_ADDR
              value: 0.0.0.0
            - name: WAZUH_CLUSTER_BIND_ADDR
              value: 0.0.0.0
            - name: WAZUH_CLUSTER_NODES
              value: wazuh-manager-master-0.wazuh-cluster
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-credentials
                  key: cluster.key
          volumeMounts:
            - { name: wazuh-credentials, mountPath: /run/secrets, readOnly: true }
            - { name: wazuh-manager-config, mountPath: /wazuh-config-mount/etc/wazuh-manager.conf, subPath: wazuh-manager.conf, readOnly: true }
            - { name: data, mountPath: /var/wazuh-manager/api/configuration, subPath: wazuh/var/wazuh-manager/api/configuration }
            - { name: data, mountPath: /etc/wazuh-manager, subPath: wazuh/etc/wazuh-manager }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/ca/root-ca.pem, subPath: ca-root-ca.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/root-ca.pem, subPath: root-ca.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/indexer-ca.pem, subPath: indexer-ca.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/indexer-connector.pem, subPath: indexer-connector.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/indexer-connector-key.pem, subPath: indexer-connector-key.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/remoted.pem, subPath: remoted.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/remoted-key.pem, subPath: remoted-key.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/apid.pem, subPath: apid.pem }
            - { name: wazuh-manager-certs, mountPath: /etc/wazuh-manager/certs/apid-key.pem, subPath: apid-key.pem }
            - { name: data, mountPath: /var/wazuh-manager/logs, subPath: wazuh/var/wazuh-manager/logs }
            - { name: data, mountPath: /var/wazuh-manager/queue, subPath: wazuh/var/wazuh-manager/queue }
            - { name: data, mountPath: /var/wazuh-manager/var/multigroups, subPath: wazuh/var/wazuh-manager/var/multigroups }
            - { name: data, mountPath: /var/wazuh-manager/data, subPath: wazuh/var/wazuh-manager/data }
          ports:
            - { containerPort: 1517, name: agents-https }
            - { containerPort: 1514, name: agents-events }
            - { containerPort: 1516, name: cluster }
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "/var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "/var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "/var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: pd-balanced-cmek
        resources:
          requests:
            storage: 10Gi
