apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-k8s-security-setup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/component: wazuh-k8s-security-setup
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: credentials
          secret:
            secretName: wazuh-credentials
            items:
              - key: indexer.env
                path: indexer.env
        - name: ca
          secret:
            secretName: wazuh-indexer-node-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: config
          configMap:
            name: wazuh-k8s-security
      containers:
        - name: reconcile
          image: python:3.13.7-alpine3.22
          command: ["python3", "-I", "/config/setup.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: credentials, mountPath: /credentials, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
            - { name: config, mountPath: /config, readOnly: true }
