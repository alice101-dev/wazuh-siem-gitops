<ossec_config>
  <agent>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>__AGENT_NAME__</agent_name>
    </enrollment>
    <manager>
      <endpoint>wazuh-agents.wazuh.svc.cluster.local:1517/wazuh-manager/</endpoint>
    </manager>
  </agent>

  <gcp-pubsub>
    <enabled>yes</enabled>
    <project_id>__GCP_PROJECT_ID__</project_id>
    <subscription_name>__GCP_SUBSCRIPTION__</subscription_name>
    <credentials_file>/etc/wazuh-gcp/credentials.json</credentials_file>
    <max_messages>100</max_messages>
    <num_threads>1</num_threads>
    <pull_on_start>yes</pull_on_start>
    <interval>1m</interval>
  </gcp-pubsub>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <sca>
    <enabled>no</enabled>
  </sca>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
