apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: wazuh-password
spec:
  length: 32
  digits: 4
  symbols: 4
  symbolCharacters: ".,_+:@%^=~-"
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: wazuh-cluster-key
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-credentials
spec:
  refreshPolicy: CreatedOnce
  target:
    name: wazuh-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: credentials
      data:
        indexer.env: |
          WAZUH_INDEXER_ADMIN_PASSWORD={{ .indexer_admin }}
          WAZUH_INDEXER_KIBANASERVER_PASSWORD={{ .indexer_kibanaserver }}
          WAZUH_INDEXER_MANAGER_PASSWORD={{ .indexer_manager }}
        manager.env: |
          WAZUH_INDEXER_MANAGER_PASSWORD={{ .indexer_manager }}
          WAZUH_MANAGER_API_PASSWORD={{ .manager_api }}
          WAZUH_MANAGER_WUI_PASSWORD={{ .manager_wui }}
        dashboard.env: |
          WAZUH_INDEXER_KIBANASERVER_PASSWORD={{ .indexer_kibanaserver }}
          WAZUH_MANAGER_WUI_PASSWORD={{ .manager_wui }}
        cluster.key: "{{ .cluster_key }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: wazuh-password
      rewrite:
        - regexp:
            source: ^password$
            target: indexer_admin
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: wazuh-password
      rewrite:
        - regexp:
            source: ^password$
            target: indexer_kibanaserver
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: wazuh-password
      rewrite:
        - regexp:
            source: ^password$
            target: indexer_manager
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: wazuh-password
      rewrite:
        - regexp:
            source: ^password$
            target: manager_api
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: wazuh-password
      rewrite:
        - regexp:
            source: ^password$
            target: manager_wui
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: wazuh-cluster-key
      rewrite:
        - regexp:
            source: ^password$
            target: cluster_key
