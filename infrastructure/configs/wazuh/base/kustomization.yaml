apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wazuh
resources:
  - pki.yaml
  - credentials.yaml
  - network-policies.yaml
  - indexer.yaml
  - manager.yaml
  - dashboard.yaml
  - collector.yaml
  - content-setup.yaml
  - alerting-setup.yaml
  - k8s-security-setup.yaml
configMapGenerator:
  - name: wazuh-k8s-security
    files:
      - k8s-security/setup.py
      - k8s-security/gke-kubernetes.yaml
      - k8s-security/falco.yaml
      - k8s-security/gcp-security.yaml
      - k8s-security/gke-requests.yaml
      - k8s-security/gke-network-policy.yaml
      - k8s-security/dashboard.yaml
  - name: wazuh-manager-config
    files:
      - manager/wazuh-manager.conf
  - name: wazuh-gcp-collector-config
    files:
      - collector/ossec.conf
  - name: wazuh-gcp-collector-workload-identity
    files:
      - credentials.json=collector/workload-identity.json
  - name: wazuh-alerting-monitor
    files:
      - alerting/findings-monitor.yaml
      - alerting/cluster-health-monitor.yaml
      - alerting/disk-usage-monitor.yaml
      - alerting/pipeline-freshness-monitor.yaml
      - alerting/falco-canary-monitor.yaml
      - alerting/port-scan-monitor.yaml
      - alerting/permission-enumeration-monitor.yaml
images:
  - name: wazuh/wazuh-indexer
    newTag: 5.0.0-rc2
  - name: wazuh/wazuh-manager
    newTag: 5.0.0-rc2
  - name: wazuh/wazuh-dashboard
    newTag: 5.0.0-rc2
  - name: wazuh-gcp-collector
    newTag: f62e83e3
