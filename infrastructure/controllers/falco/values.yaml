driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true

tolerations:
  - operator: Exists

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { memory: 768Mi }

collectors:
  containerEngine:
    engines:
      docker: { enabled: false }
      podman: { enabled: false }
      lxc: { enabled: false }
      libvirt_lxc: { enabled: false }
      bpm: { enabled: false }

falcoctl:
  artifact:
    follow:
      enabled: false
  config:
    artifact:
      install:
        # Stable rules plus the incubating and sandbox rulesets; only the rules enabled under falco.rules run.
        refs: ["falco-rules:5", "falco-incubating-rules:6", "falco-sandbox-rules:6"]

falco:
  priority: notice
  # Emit every rule an event matches, not only the first: a container can be privileged and untrusted at once.
  rule_matching: all
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco-incubating_rules.yaml
    - /etc/falco/falco-sandbox_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d
  # Incubating and sandbox rules are off except the ones below, which add coverage the stable and custom rules lack.
  rules:
    - disable:
        tag: maturity_incubating
    - disable:
        tag: maturity_sandbox
    - enable:
        rule: Modify Shell Configuration File
    - enable:
        rule: Create files below dev
    - enable:
        rule: Change thread namespace
    - enable:
        rule: Exfiltrating Artifacts via Kubernetes Control Plane
    - enable:
        rule: Potential Local Privilege Escalation via Environment Variables Misuse
    - enable:
        rule: Backdoored library loaded into SSHD (CVE-2024-3094)
    - enable:
        rule: BPF Program Not Profiled
    - enable:
        rule: Launch Ingress Remote File Copy Tools in Container
    - enable:
        rule: User mgmt binaries
    - enable:
        rule: Detect crypto miners using the Stratum protocol
    - enable:
        rule: Sudo Potential Privilege Escalation
    - enable:
        rule: Unprivileged Delegation of Page Faults Handling to a Userspace Process
    - enable:
        rule: Polkit Local Privilege Escalation Vulnerability (CVE-2021-4034)
    - enable:
        rule: Web Server Spawned Shell
    - enable:
        rule: Reverse Shell from Web Server
    - enable:
        rule: Privileged Container Device Access
    - enable:
        rule: Container Access to Host Sensitive Paths
    - enable:
        rule: Basic Interactive Reconnaissance
  json_output: true
  json_include_output_property: true
  json_include_output_fields_property: true
  json_include_tags_property: true
  append_output:
    - suggested_output: true
    - extra_fields:
        - wazuh_integration: "falco"
        - wazuh_k8s_ns: "%k8s.ns.name"
        - wazuh_k8s_pod: "%k8s.pod.name"
        - wazuh_container_id: "%container.id"
        - wazuh_container_name: "%container.name"
        - wazuh_container_image: "%container.image.repository"
        - wazuh_proc_name: "%proc.name"
        - wazuh_proc_cmdline: "%proc.cmdline"
        - wazuh_proc_exepath: "%proc.exepath"
        - wazuh_proc_pid: "%proc.pid"
        - wazuh_proc_pname: "%proc.pname"
        - wazuh_user_name: "%user.name"
        - wazuh_user_uid: "%user.uid"
        - wazuh_fd_name: "%fd.name"
        - wazuh_evt_type: "%evt.type"

falcosidekick:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1234
    fsGroup: 1234
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  webui:
    enabled: false
  config:
    gcp:
      pubsub:
        minimumpriority: notice
    extraEnv:
      - name: GCP_PUBSUB_PROJECTID
        valueFrom:
          configMapKeyRef:
            name: falcosidekick-gcp
            key: project_id

# Container launch rules escalated to Critical, so they reach Slack as critical Wazuh findings.
# Exceptions match on namespace and image together: a pod in kube-system with another image still alerts.
customRules:
  wazuh-container-launch.yaml: |-
    - macro: wazuh_container_started
      condition: >
        (spawned_process and container and container.image.repository != ""
         and (proc.vpid=1 or (container.host_pid=true and container_entrypoint)))

    - macro: wazuh_gke_system_container
      condition: >
        (k8s.ns.name = kube-system
         and (container.image.repository contains "-artifactregistry.gcr.io/gke-release/"
              or container.image.repository contains "-artifactregistry.gcr.io/gke-release-staging/"
              or container.image.repository startswith "gke.gcr.io/"))

    - macro: wazuh_falco_container
      condition: >
        (k8s.ns.name = falco
         and container.image.repository in (docker.io/falcosecurity/falco, docker.io/falcosecurity/falcoctl))

    - list: wazuh_trusted_images
      items:
        - docker.io/wazuh/wazuh-indexer
        - docker.io/wazuh/wazuh-manager
        - docker.io/wazuh/wazuh-dashboard
        - docker.io/curlimages/curl
        - docker.io/library/python
        - docker.io/mikefarah/yq
        - docker.io/falcosecurity/falco
        - docker.io/falcosecurity/falcoctl
        - docker.io/falcosecurity/falcosidekick
        - quay.io/argoproj/argocd
        - ecr-public.aws.com/docker/library/redis
        - quay.io/jetstack/cert-manager-controller
        - quay.io/jetstack/cert-manager-cainjector
        - quay.io/jetstack/cert-manager-webhook
        - ghcr.io/external-secrets/external-secrets

    - macro: wazuh_trusted_image
      condition: >
        (container.image.repository in (wazuh_trusted_images)
         or container.image.repository contains "-artifactregistry.gcr.io/gke-release/"
         or container.image.repository contains "-artifactregistry.gcr.io/gke-release-staging/"
         or container.image.repository startswith "gke.gcr.io/"
         or container.image.repository startswith "registry.k8s.io/"
         or (container.image.repository startswith "asia-southeast2-docker.pkg.dev/"
             and container.image.repository endswith "/staging-siem/wazuh-gcp-collector"))

    # container.mounts is "source:dest:mode:rdwr:propagation" items joined by commas; match the exact source.
    - macro: wazuh_sensitive_host_mount
      condition: >
        (container.mounts startswith "/:" or container.mounts contains ",/:"
         or container.mounts startswith "/etc:" or container.mounts contains ",/etc:"
         or container.mounts startswith "/proc:" or container.mounts contains ",/proc:"
         or container.mounts startswith "/sys:" or container.mounts contains ",/sys:"
         or container.mounts startswith "/dev:" or container.mounts contains ",/dev:"
         or container.mounts startswith "/boot:" or container.mounts contains ",/boot:"
         or container.mounts startswith "/root:" or container.mounts contains ",/root:"
         or container.mounts startswith "/home:" or container.mounts contains ",/home:"
         or container.mounts startswith "/run:" or container.mounts contains ",/run:"
         or container.mounts startswith "/var/run:" or container.mounts contains ",/var/run:"
         or container.mounts startswith "/run/containerd:" or container.mounts contains ",/run/containerd:"
         or container.mounts startswith "/run/containerd/containerd.sock:" or container.mounts contains ",/run/containerd/containerd.sock:"
         or container.mounts startswith "/var/run/docker.sock:" or container.mounts contains ",/var/run/docker.sock:"
         or container.mounts startswith "/var/lib/containerd:" or container.mounts contains ",/var/lib/containerd:"
         or container.mounts startswith "/var/lib/kubelet:" or container.mounts contains ",/var/lib/kubelet:"
         or container.mounts startswith "/var/lib/kubelet/pki:" or container.mounts contains ",/var/lib/kubelet/pki:"
         or container.mounts startswith "/var/lib/kubelet/kubeconfig:" or container.mounts contains ",/var/lib/kubelet/kubeconfig:"
         or container.mounts startswith "/etc/kubernetes:" or container.mounts contains ",/etc/kubernetes:"
         or container.mounts startswith "/home/kubernetes:" or container.mounts contains ",/home/kubernetes:")

    - rule: Privileged container started
      desc: A container started in privileged mode outside the GKE system DaemonSets and Falco; it can reach the host and escape the container.
      condition: wazuh_container_started and container.privileged=true and not wazuh_gke_system_container and not wazuh_falco_container
      output: Privileged container started (image=%container.image.repository:%container.image.tag ns=%k8s.ns.name pod=%k8s.pod.name command=%proc.cmdline)
      priority: CRITICAL
      tags: [container, mitre_privilege_escalation, T1611]

    - rule: Container with host namespaces started
      desc: A container started in the host network, PID or IPC namespace outside the GKE system DaemonSets and Falco.
      condition: >
        wazuh_container_started
        and (container.host_network=true or container.host_pid=true or container.host_ipc=true)
        and not wazuh_gke_system_container and not wazuh_falco_container
      output: Container with host namespaces started (host_network=%container.host_network host_pid=%container.host_pid host_ipc=%container.host_ipc image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [container, mitre_privilege_escalation, T1611]

    - rule: Container with sensitive host mount started
      desc: A container started with a sensitive host path mounted (the root filesystem, /etc, /proc, a container runtime socket, kubelet credentials) outside the GKE system DaemonSets and Falco.
      condition: wazuh_container_started and wazuh_sensitive_host_mount and not wazuh_gke_system_container and not wazuh_falco_container
      output: Container with sensitive host mount started (mounts=%container.mounts image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [container, mitre_privilege_escalation, T1611]

    - rule: Container from an untrusted image started
      desc: A container started from an image outside the registries and images this cluster runs (GKE, the SIEM Artifact Registry, Wazuh, Argo CD, cert-manager, External Secrets, Falco and the hook images).
      condition: wazuh_container_started and not wazuh_trusted_image
      output: Container from an untrusted image started (image=%container.image.repository:%container.image.tag ns=%k8s.ns.name pod=%k8s.pod.name command=%proc.cmdline)
      priority: CRITICAL
      tags: [container, mitre_execution, T1610]

    # A reverse shell (stdin/stdout of a process on a socket) is Notice upstream; here it is an incident.
    - rule: Redirect STDOUT/STDIN to Network Connection in Container
      override:
        priority: replace
      priority: CRITICAL

    # End-to-end heartbeat: the falco-canary CronJob runs this command every 10 minutes, and the Wazuh
    # monitor "Falco runtime detection silent" alerts when no canary reached Wazuh for 30 minutes.
    - rule: Falco canary
      desc: Heartbeat from the falco-canary CronJob that proves Falco, Falcosidekick and the Pub/Sub path to Wazuh work.
      condition: spawned_process and container and k8s.ns.name = falco and proc.cmdline contains "falco-canary-beacon"
      output: Falco canary beacon (pod=%k8s.pod.name command=%proc.cmdline)
      priority: NOTICE
      tags: [canary]

    # Post-exploitation techniques the stable ruleset leaves out (found by the attack simulation).
    - macro: wazuh_metadata_client
      condition: >
        (wazuh_gke_system_container
         or (k8s.ns.name = wazuh and container.image.repository endswith "/staging-siem/wazuh-gcp-collector")
         or (k8s.ns.name = falco and container.image.repository = docker.io/falcosecurity/falcosidekick)
         or (k8s.ns.name = external-secrets and container.image.repository = ghcr.io/external-secrets/external-secrets))

    - rule: Contact GKE metadata server from container
      desc: A container connected to the metadata server (169.254.169.254), which hands out Google access tokens through Workload Identity, outside the workloads that are meant to use it.
      condition: >
        evt.type = connect and container and fd.sip = "169.254.169.254"
        and not wazuh_metadata_client
      output: Container contacted the GKE metadata server (connection=%fd.name image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name command=%proc.cmdline)
      priority: CRITICAL
      tags: [container, network, mitre_credential_access, T1552.005]

    - list: wazuh_package_managers
      items: [apk, apt, apt-get, aptitude, dpkg, yum, dnf, microdnf, rpm, zypper, pip, pip3, npm, gem]

    - rule: Package management process launched in container
      desc: A package manager ran inside a running container, which installs tools the image does not ship (container drift).
      condition: spawned_process and container and proc.name in (wazuh_package_managers)
      output: Package manager launched in container (command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, process, mitre_execution, T1105]

    - rule: Write below binary directory in container
      desc: A file was written below a binary directory of a running container, how a dropped tool or a trojaned binary lands.
      condition: >
        evt.type in (open, openat, openat2) and evt.is_open_write = true and container
        and fd.directory in (/bin, /sbin, /usr/bin, /usr/sbin, /usr/local/bin, /usr/local/sbin)
      output: File written below a binary directory (file=%fd.name command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, filesystem, mitre_persistence, T1105]

    - rule: Shell history deleted or truncated in container
      desc: A shell history file was deleted, renamed or emptied inside a container to hide the attacker's commands.
      condition: >
        container and (
          (evt.type in (unlink, unlinkat, rename, renameat, renameat2) and fs.path.name contains "_history")
          or (evt.type in (open, openat, openat2) and evt.is_open_write = true and fd.name contains "_history"
              and evt.arg.flags contains "O_TRUNC"))
      output: Shell history deleted or truncated (file=%fs.path.name%fd.name command=%proc.cmdline ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, filesystem, mitre_defense_evasion, T1070.003]

    # Platform workloads this cluster runs on purpose; their own behaviour is not an attack.
    - macro: wazuh_platform_container
      condition: >
        (wazuh_gke_system_container or wazuh_falco_container
         or (k8s.ns.name in (wazuh, argocd, cert-manager, external-secrets) and wazuh_trusted_image))

    - list: wazuh_miner_binaries
      items: [xmrig, xmr-stak, xmr-stak-cpu, minerd, cpuminer, cpuminer-multi, ccminer, nbminer, t-rex, lolminer, phoenixminer, ethminer, nanominer, gminer, kdevtmpfsi, kinsing]

    - rule: Crypto miner launched in container
      desc: A known miner binary ran, or a process was started with a mining pool URL or miner options.
      condition: >
        spawned_process and container
        and (proc.name in (wazuh_miner_binaries)
             or proc.cmdline contains "stratum+tcp://" or proc.cmdline contains "stratum+ssl://"
             or proc.cmdline contains "stratum2+tcp://" or proc.cmdline contains "--donate-level"
             or proc.cmdline contains "--cpu-priority" or proc.cmdline contains "nicehash")
      output: Crypto miner launched (command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [container, process, mitre_impact, T1496]

    - rule: Outbound connection to a mining pool port
      desc: A container connected to a port that mining pools use (Stratum).
      condition: >
        evt.type = connect and container and fd.typechar = 4
        and fd.sport in (3333, 3334, 3335, 5555, 5556, 7777, 8333, 9999, 14433, 14444, 45560, 45700)
        and not wazuh_platform_container
      output: Connection to a mining pool port (connection=%fd.name command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [container, network, mitre_impact, T1496]

    - list: wazuh_cluster_clients
      items: [kubectl, crictl, ctr, docker, nerdctl, podman, helm, kubeletctl, peirates, kube-hunter, kubescape, kdigger, amicontained, deepce, cdk, botb]

    - rule: Kubernetes or container runtime client in container
      desc: A Kubernetes, container runtime or container attack client ran inside a container, typical of lateral movement or escape attempts.
      condition: >
        spawned_process and container and proc.name in (wazuh_cluster_clients)
        and not (k8s.ns.name = argocd and container.image.repository = quay.io/argoproj/argocd)
      output: Cluster client launched in container (command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, process, mitre_execution, T1609]

    - list: wazuh_recon_tools
      items: [nmap, masscan, zmap, rustscan, nping, hping3, arp-scan, nbtscan, tcpdump, tshark, dumpcap, ngrep, socat]

    - rule: Network reconnaissance tool in container
      desc: A port scanner, packet capture or relay tool ran inside a container.
      condition: spawned_process and container and proc.name in (wazuh_recon_tools) and not wazuh_platform_container
      output: Network reconnaissance tool launched (command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, process, mitre_discovery, T1046]

    - rule: Contact kubelet API from container
      desc: A container connected to the kubelet API of a node (ports 10250, 10255), how an attacker lists or execs into every pod of the node.
      condition: >
        evt.type = connect and container and fd.typechar = 4 and fd.sport in (10250, 10255)
        and not wazuh_platform_container
      output: Container contacted a kubelet API (connection=%fd.name command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [container, network, mitre_lateral_movement, T1210]

    - rule: Read service account token of another pod
      desc: A container read a projected service account token from the kubelet pod directory of the node, the tokens of every other pod.
      condition: >
        evt.type in (open, openat, openat2) and evt.is_open_read = true and container
        and fd.name contains "/volumes/kubernetes.io~projected/" and fd.name endswith "/token"
        and not wazuh_platform_container
      output: Service account token of another pod read (file=%fd.name command=%proc.cmdline ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [container, filesystem, mitre_credential_access, T1528]

    - rule: Persistence file modified in container
      desc: Accounts, sudoers, SSH authorized keys or cron tables were written inside a container.
      condition: >
        evt.type in (open, openat, openat2) and evt.is_open_write = true and container
        and (fd.name in (/etc/passwd, /etc/shadow, /etc/group, /etc/gshadow, /etc/sudoers)
             or fd.name startswith /etc/sudoers.d/
             or fd.name endswith "/.ssh/authorized_keys" or fd.name endswith "/.ssh/authorized_keys2"
             or fd.name startswith /etc/cron or fd.name startswith /etc/crontabs/
             or fd.name startswith /var/spool/cron/)
        and not wazuh_platform_container
      output: Persistence file modified (file=%fd.name command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, filesystem, mitre_persistence, T1098.004, T1053.003, T1136]

    - rule: Base64 decoding in container
      desc: Content was decoded from base64 inside a container, how obfuscated payloads are unpacked before they run.
      condition: >
        spawned_process and container and not wazuh_platform_container
        and ((proc.name = base64 and (proc.args contains "-d" or proc.args contains "--decode"))
             or proc.cmdline contains "base64 -d" or proc.cmdline contains "base64 --decode"
             or proc.cmdline contains "b64decode")
      output: Base64 decoding in container (command=%proc.cmdline parent=%proc.pname image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, process, mitre_defense_evasion, T1140]

    - rule: Credential file read in container
      desc: A cloud, cluster, registry or Git credential file, or an SSH private key, was opened for reading inside a container outside the platform workloads.
      condition: >
        evt.type in (open, openat, openat2) and evt.is_open_read = true and container and not wazuh_platform_container
        and (fd.name contains "/.config/gcloud/" or fd.name endswith "/.kube/config" or fd.name endswith "/.aws/credentials"
             or fd.name endswith "/.docker/config.json" or fd.name endswith "/.git-credentials"
             or fd.name contains "/.ssh/id_")
      output: Credential file read in container (file=%fd.name process=%proc.name command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, filesystem, mitre_credential_access, T1552.001]

    - rule: Setuid or setgid bit set in container
      desc: A file was given the setuid or setgid bit inside a container, how a backdoor keeps root after the attacker drops to a normal user.
      condition: >
        evt.type in (chmod, fchmod, fchmodat) and container and not wazuh_platform_container
        and (evt.arg.mode contains "S_ISUID" or evt.arg.mode contains "S_ISGID")
      output: Setuid or setgid bit set in container (mode=%evt.arg.mode file=%evt.arg.filename process=%proc.name command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, filesystem, mitre_privilege_escalation, T1548.001]

    - rule: Mount or namespace tool in container
      desc: mount, umount, nsenter or unshare ran inside a container outside the GKE system and platform workloads, the tools of a container escape.
      condition: >
        spawned_process and container and not wazuh_platform_container
        and evt.res = SUCCESS
        and proc.name in (mount, umount, nsenter, unshare) and not proc.pname in (mount, umount, nsenter, unshare)
      output: Mount or namespace tool in container (command=%proc.cmdline parent=%proc.pname image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [container, process, mitre_privilege_escalation, T1611]

    - rule: SSH or remote copy client in container
      desc: An SSH, SCP, SFTP or rsync client ran inside a container, how an attacker moves to other hosts or pulls data out.
      condition: >
        spawned_process and container and not wazuh_platform_container
        and proc.name in (ssh, scp, sftp, sshpass, rsync, dbclient)
      output: SSH or remote copy client in container (command=%proc.cmdline parent=%proc.pname image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, network, mitre_lateral_movement, T1021.004]

    - rule: Environment of another process read in container
      desc: The environment of another process (/proc/<pid>/environ) was read inside a container, where tokens and passwords passed as variables are kept.
      condition: >
        evt.type in (open, openat, openat2) and evt.is_open_read = true and container and not wazuh_platform_container
        and fd.name glob "/proc/*/environ" and not fd.name in (/proc/self/environ, /proc/thread-self/environ)
      output: Environment of another process read in container (file=%fd.name process=%proc.name command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, filesystem, mitre_credential_access, T1552.007]

    - rule: Python startup hook modified in container
      desc: A .pth file or a sitecustomize or usercustomize module was written in a Python site directory inside a container, code every Python process then runs at start.
      condition: >
        evt.type in (open, openat, openat2) and evt.is_open_write = true and container and not wazuh_platform_container
        and (fd.directory endswith /site-packages or fd.directory endswith /dist-packages)
        and (fd.filename endswith .pth or fd.filename startswith sitecustomize. or fd.filename startswith usercustomize.)
        and not proc.name in (pip, pip3, apk, apt, apt-get, dpkg, yum, dnf, rpm, conda, poetry, uv)
        and not (proc.name startswith python and proc.args contains "-m pip")
      output: Python startup hook modified in container (file=%fd.name process=%proc.name command=%proc.cmdline image=%container.image.repository ns=%k8s.ns.name pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, filesystem, mitre_persistence, T1546.018]

    # Upstream incubating and sandbox rules that the GKE system and platform workloads trip by design.
    - rule: Privileged Container Device Access
      condition: and not wazuh_platform_container
      override:
        condition: append

    - rule: Container Access to Host Sensitive Paths
      condition: and not wazuh_platform_container
      override:
        condition: append

    - rule: Change thread namespace
      condition: and not wazuh_platform_container
      override:
        condition: append

    - rule: BPF Program Not Profiled
      condition: and not wazuh_platform_container and not proc.name in (runc, containerd, containerd-shim, containerd-shim-runc-v2)
      override:
        condition: append

    - rule: Potential Local Privilege Escalation via Environment Variables Misuse
      condition: and not wazuh_platform_container
      override:
        condition: append

    - rule: Launch Ingress Remote File Copy Tools in Container
      condition: and not wazuh_platform_container
      override:
        condition: append

    # Argo CD and the Wazuh setup hooks talk to the API server by design.
    - rule: Contact K8S API Server From Container
      condition: and not wazuh_platform_container
      override:
        condition: append

    # GKE image streaming (gcfsd) unpacks image layers on the node, /etc/skel shell files included.
    - rule: Modify Shell Configuration File
      condition: and not (proc.name = gcfsd-v2 and fd.name startswith /var/lib/containerd/)
      override:
        condition: append

    # kubectl cp out of a container is data leaving the cluster: raised from Notice so it reaches Slack.
    - rule: Exfiltrating Artifacts via Kubernetes Control Plane
      override:
        priority: replace
      priority: ERROR

    - rule: Linux Kernel Module Injection Detected
      override:
        priority: replace
      priority: CRITICAL

