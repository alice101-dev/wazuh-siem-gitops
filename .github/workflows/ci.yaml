name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  HELM_VERSION: v4.2.1
  KUSTOMIZE_VERSION: v5.8.1
  KUBECONFORM_VERSION: v0.8.0
  TERRAFORM_VERSION: 1.15.4
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          bin="$HOME/.local/bin" && mkdir -p "$bin" && cd "$RUNNER_TEMP"
          gl="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$gl/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.sha256 "$gl/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" gitleaks.sha256 | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
      - name: No secrets in the history
        run: gitleaks git --redact --verbose --exit-code 1 .

  manifests:
    name: Argo CD applications
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install Kustomize and kubeconform
        run: |
          bin="$HOME/.local/bin" && mkdir -p "$bin" && cd "$RUNNER_TEMP"
          kz="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}"
          curl -fsSLO "$kz/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o kustomize.sha256 "$kz/checksums.txt"
          grep " kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz\$" kustomize.sha256 | sha256sum -c -
          tar -xzf "kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -C "$bin" kustomize
          kc="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "$kc/kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o kubeconform.sha256 "$kc/CHECKSUMS"
          grep " kubeconform-linux-amd64.tar.gz\$" kubeconform.sha256 | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz -C "$bin" kubeconform
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: pip install -r ci/requirements.txt
      - name: Tool versions
        run: helm version --short && kustomize version && kubeconform -v
      - name: Render and validate every generated Argo CD Application
        run: python3 ci/render_manifests.py "$RUNNER_TEMP/rendered"

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Validate every workspace
        run: |
          for ws in terraform/environments/*/*/; do
            echo "== $ws"
            terraform -chdir="$ws" init -backend=false -input=false >/dev/null
            terraform -chdir="$ws" validate
          done
